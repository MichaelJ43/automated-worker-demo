<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster 9000</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="hero">
        <h1>TaskMaster 9000</h1>
        <p id="subtitle">A local demo todo app</p>
    </header>

    <main class="layout">
        <form id="task-form" class="panel">
            <label for="task-input">New task</label>
            <div class="row">
                <input type="text" id="task-input" name="task" autocomplete="off" placeholder="What needs doing?">
                <button type="submit" id="add-btn">Add</button>
            </div>
        </form>

        <form id="pin-form" class="panel">
            <label for="pin-input">Device PIN (hashed before it is saved)</label>
            <div class="row">
                <input type="password" id="pin-input" name="pin" autocomplete="new-password">
                <button type="submit" id="pin-btn">Save PIN</button>
            </div>
            <p id="pin-status" class="status" role="status"></p>
        </form>

        <section class="panel" aria-labelledby="task-list-heading">
            <div class="list-header">
                <h2 id="task-list-heading">Tasks</h2>
                <p id="stats" aria-live="polite">0 tasks</p>
            </div>
            <ul id="task-list"></ul>
        </section>
    </main>

    <button type="button" id="clear-btn">Clear all data</button>

    <script src="app.js"></script>
</body>
</html>
